name: CI

on:
  push:
    branches:
    - master

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - vltl_amd64_linux
          - vltl_amd64_windows.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: sudo apt update && sudo apt install -y make clang lld mingw-w64

      - name: Build
        run: make ${{ matrix.target }}

	  - name: Upload artifact
		uses: actions/upload-artifact@v4
		with:
		  name: vltl-${{ matrix.target }}-${{ github.sha }}
		  path: vltl-${{ matrix.target }}
